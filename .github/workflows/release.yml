# The npm trusted publisher for @quario/mcp is registered against this file's
# name, not the shared workflow it calls.
name: Release

on:
  push:
    branches:
      - main
  # Re-runs a publish that failed after its tag and Release were created.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: getquario/meta/.github/workflows/release.yml@main
    with:
      version_script: npm run release:version
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  registry:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login dns --domain getquario.com --private-key "$MCP_REGISTRY_KEY"
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
      - run: ./mcp-publisher publish
